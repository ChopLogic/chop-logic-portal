name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["Portal"]
projects: ["ChopLogic/3"]

body:
  - type: markdown
    attributes:
      value: Please fill out the information below to help us diagnose the issue.

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: input
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: The button should trigger the action.
    validations:
      required: true

  - type: input
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
      placeholder: The button did nothing.
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: Screenshots, logs, or any additional details.
    validations:
      required: false
